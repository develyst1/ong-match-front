server {
    listen 80;
    server_name tocktest.develyst.online;
    location /.well-known/acme-challenge/ { root C:/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name tocktest.develyst.online;

    ssl_certificate     C:/nginx/ssl/tocktest.develyst.online-chain.pem;
    ssl_certificate_key C:/nginx/ssl/tocktest.develyst.online-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3012;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:4004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
