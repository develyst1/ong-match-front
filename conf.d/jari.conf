server {
    listen 80;
    server_name jari.develyst.online;
    location /.well-known/acme-challenge/ { root C:/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name jari.develyst.online;

    ssl_certificate     C:/nginx/ssl/jari.develyst.online-chain.pem;
    ssl_certificate_key C:/nginx/ssl/jari.develyst.online-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    # Backend API (Bun) — serves at root, so strip /api/ via trailing slash
    location /api/ {
        proxy_pass http://127.0.0.1:4005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend (Next.js standalone)
    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
