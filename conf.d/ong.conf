server {
    listen 80;
    server_name ong.develyst.online;
    location /.well-known/acme-challenge/ { root C:/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name ong.develyst.online;

    ssl_certificate     C:/nginx/ssl/ong.develyst.online-chain.pem;
    ssl_certificate_key C:/nginx/ssl/ong.develyst.online-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    # Backend (Bun) — ALL /api/* routes, including /api/v1/auth/login and
    # /api/v1/auth/register (see src/routes/auth.ts). This project has NO
    # NextAuth on the frontend, so there must be no separate /api/v1/auth/
    # location — otherwise nginx would route auth to the frontend and 404.
    # No path strip: pass the full path straight through.
    location /api/ {
        proxy_pass http://127.0.0.1:4009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Frontend (Next.js standalone)
    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
