server {
    listen 80;
    server_name som.develyst.online;
    location /.well-known/acme-challenge/ { root C:/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name som.develyst.online;

    ssl_certificate     C:/nginx/ssl/som.develyst.online-chain.pem;
    ssl_certificate_key C:/nginx/ssl/som.develyst.online-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    # Backend credentials login. Collides with NextAuth's /api/auth/* namespace,
    # so pin this ONE exact path to the backend (exact match beats the prefix below).
    # The frontend authorize() does POST https://som.develyst.online/api/auth/login.
    location = /api/auth/login {
        proxy_pass http://127.0.0.1:4006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # NextAuth handler lives at /api/auth/* on the Next.js frontend.
    # More specific prefix than /api/ so nginx matches this first → keep it on 3014.
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3014;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Backend API (Bun) — routes already include /api, so pass through (no strip)
    location /api/ {
        proxy_pass http://127.0.0.1:4006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend (Next.js standalone)
    location / {
        proxy_pass http://127.0.0.1:3014;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
